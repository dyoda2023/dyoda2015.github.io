<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DYODA | Gaming Hub & Comunitate</title>
    <style>
        :root {
            --bg-color: #0b0c10;
            --container-bg: rgba(13, 17, 23, 0.90);
            --neon-green: #00ff66;
            --twitch-purple: #9146ff;
            --tiktok-black: #010101;
            --youtube-red: #ff0000;
            --discord-blue: #5865F2;
            --text-color: #e0e6ed;
            --white: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(rgba(11, 12, 16, 0.85), rgba(11, 12, 16, 0.9)), 
                        url('studio.jpg') no-repeat center center fixed;
            background-size: cover;
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Dacă poza de fundal are alt nume, căutăm fișierele din folder */
        body:has(* ) {
            background-image: linear-gradient(rgba(11, 12, 16, 0.85), rgba(11, 12, 16, 0.9)), url('1000040111.jpg');
        }

        .container {
            background: var(--container-bg);
            border: 1px solid rgba(0, 255, 102, 0.25);
            border-radius: 24px;
            padding: 35px 25px;
            width: 100%;
            max-width: 480px;
            text-align: center;
            box-shadow: 0 0 40px rgba(0, 255, 102, 0.15);
            backdrop-filter: blur(12px);
        }

        .profile-container {
            position: relative;
            width: 120px;
            height: 120px;
            margin: 0 auto 15px auto;
        }

        .profile-img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--neon-green);
            box-shadow: 0 0 20px rgba(0, 255, 102, 0.4);
        }

        h1 {
            font-size: 2.2rem;
            color: var(--white);
            margin-bottom: 5px;
            text-shadow: 0 0 10px rgba(0, 255, 102, 0.3);
            letter-spacing: 1px;
        }

        .subtitle {
            color: var(--neon-green);
            font-size: 0.9rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 25px;
        }

        .gallery-title {
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--white);
            margin-bottom: 12px;
            text-align: left;
            font-weight: 600;
            border-left: 3px solid var(--neon-green);
