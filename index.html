<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DYODA | Gaming Hub & Comunitate</title>
    <style>
        :root {
            --bg-color: #0b0c10;
            --container-bg: rgba(13, 17, 23, 0.90);
            --neon-green: #00ff66;
            --twitch-purple: #9146ff;
            --tiktok-black: #010101;
            --youtube-red: #ff0000;
            --discord-blue: #5865F2;
            --text-color: #e0e6ed;
            --white: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(rgba(11, 12, 16, 0.8), rgba(11, 12, 16, 0.85)), 
                        url('https://i.imgur.com/n6b3vRk.jpeg') no-repeat center center fixed;
            background-size: cover;
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: var(--container-bg);
            border: 1px solid rgba(0, 255, 102, 0.25);
            border-radius: 24px;
            padding: 35px 25px;
            width: 100%;
            max-width: 480px;
            text-align: center;
            box-shadow: 0 0 40px rgba(0, 255, 102, 0.15);
            backdrop-filter: blur(12px);
        }

        .profile-img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--neon-green);
            box-shadow: 0 0 20px rgba(0, 255, 102, 0.4);
            margin-bottom: 15px;
        }

        h1 {
            font-size: 2.2rem;
            color: var(--white);
            margin-bottom: 5px;
            text-shadow: 0 0 10px rgba(0, 255, 102, 0.3);
            letter-spacing: 1px;
        }

        .subtitle {
            color: var(--neon-green);
            font-size: 0.9rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 25px;
        }

        /* Sectiunea Galerie Jocuri */
        .gallery-title {
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--white);
            margin-bottom: 12px;
            text-align: left;
            font-weight: 600;
            border-left: 3px solid var(--neon-green);
            padding-left: 8px;
        }

        .games-gallery {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 30px;
        }

        .game-card {
            position: relative;
            border-radius: 10px;
            overflow: hidden;
            height: 90px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }

        .game-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .game-card:hover img {
            transform: scale(1.08);
        }

        /* Container Linkuri */
        .links-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 14px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: bold;
            font-size: 1.05rem;
            transition: all 0.3s ease;
            color: var(--white);
            letter-spacing: 0.5px;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        .twitch {
            background: var(--twitch-purple);
            box-shadow: 0 4px 12px rgba(145, 70, 255, 0.25);
        }
        .twitch:hover { box-shadow: 0 0 15px rgba(145, 70, 255, 0.5); }

        .tiktok {
            background: var(--tiktok-black);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .tiktok:hover { box-shadow: 0 0 15px rgba(255, 255, 255, 0.3); }

        .youtube {
            background: var(--youtube-red);
            box-shadow: 0 4px 12px rgba(255, 0, 0, 0.25);
        }
        .youtube:hover { box-shadow: 0 0 15px rgba(255, 0, 0, 0.5); }

        .discord {
            background: var(--discord-blue);
            box-shadow: 0 4px 12px rgba(88, 101, 242, 0.25);
        }
        .discord:hover { box-shadow: 0 0 15px rgba(88, 101, 242, 0.5); }

        .footer {
            margin-top: 30px;
            font-size: 0.75rem;
            color: rgba(224, 230, 230, 0.4);
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="container">
        <img src="https://i.imgur.com/8mU3wK6.jpeg" alt="DYODA" class="profile-img">
        
        <h1>DYODA</h1>
        <div class="subtitle">World of Warcraft & TFT Streamer</div>

        <div class="gallery-title">My Games</div>
        <div class="games-gallery">
            <div class="game-card">
                <img src="https://i.imgur.com/vH3yofp.jpeg" alt="WoW Character 1">
            </div>
            <div class="game-card">
                <img src="https://i.imgur.com/C939vM1.jpeg" alt="WoW Gameplay">
            </div>
            <div class="game-card">
                <img src="https://i.imgur.com/mZ96qgK.jpeg" alt="TFT Match">
            </div>
            <div class="game-card">
                <img src="https://i.imgur.com/m4Cg778.jpeg" alt="WoW Character 2">
            </div>
        </div>

        <div class="links-container">
            <a href="https://www.twitch.tv/dyoda2015" target="_blank" class="btn twitch">TWITCH STREAM</a>
            <a href="https://www.tiktok.com/@dyodaofficial" target="_blank" class="btn tiktok">TIKTOK</a>
            <a href="https://youtube.com/@dyoda2015?si=0wE4bshH_8Y9YjXJ" target="_blank" class="btn youtube">YOUTUBE</a>
            <a href="https://discord.gg/h79uPq7Y" target="_blank" class="btn discord">ALĂTURĂ-TE PE DISCORD</a>
        </div>

        <div class="footer">
            &copy; 2026 DYODA. Toate drepturile rezervate.
        </div>
    </div>

</body>
</html>
